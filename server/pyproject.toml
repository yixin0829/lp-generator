[project]
name = "lp-generator-backend"
version = "0.1.0"
description = "Learning Path Generator backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.133.0",
    "google-cloud-firestore>=2.23.0",
    "loguru>=0.7.3",
    "openai>=2.21.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "slowapi>=0.1.9",
    "uvicorn>=0.39.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.14.1",
    "ruff>=0.13.2",
]

[tool.uv]
package = false
# Security floors for transitive dependencies; keep requirements.txt exported from uv.lock.
constraint-dependencies = [
    "anyio>=4.14.2",
    "click>=8.3.3",
    "cryptography>=50.0.0",
    "idna>=3.15",
    "pyasn1>=0.6.4",
    "pygments>=2.20.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
]

# Quality commands: make format | make lint | make test | make check
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
