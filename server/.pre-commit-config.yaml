# Mirrors `make lint` (ruff only; black/isort removed because they fight ruff's formatter).
# Run from the repo root: `uvx pre-commit run --all-files -c server/.pre-commit-config.yaml`
# No requirements-txt-fixer: server/requirements.txt is generated by `uv export` and must not be re-sorted.
files: ^server/
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1  # keep in sync with ruff in server/uv.lock
    hooks:
    -   id: ruff-check
        args: [--fix]
    -   id: ruff-format
